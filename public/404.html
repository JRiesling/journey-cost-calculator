<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Fuel Smarter</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.3.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f8f7f4; --card: #ffffff; --border: rgba(0,0,0,0.1); --text: #1a1a18; --text-secondary: #6b6b68; --info-bg: #e6f1fb; --info-border: #b5d4f4; --info-text: #0c447c; --radius: 8px; --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1a18; --card: #252523; --border: rgba(255,255,255,0.1); --text: #e8e6e0; --text-secondary: #9b9b97; --info-bg: #0c2a44; --info-border: #185fa5; --info-text: #85b7eb; } }
    body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.7; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: var(--card); border-bottom: 0.5px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 10px; }
    header a { text-decoration: none; color: var(--text); font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .content { max-width: 400px; }
    .icon { font-size: 64px; margin-bottom: 1rem; }
    h2 { font-size: 24px; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: var(--text-secondary); margin-bottom: 1.5rem; }
    a.btn { display: inline-block; background: var(--info-bg); border: 0.5px solid var(--info-border); color: var(--info-text); text-decoration: none; border-radius: var(--radius); padding: 12px 24px; font-weight: 500; }
  </style>
